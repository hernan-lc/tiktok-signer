<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>live-sdk bun check — console only</title>
  </head>
  <body>
    <!--
      HTML-only check, served directly by Bun with no app server:
        bun install --cwd examples/live-sdk-bun
        bun ./examples/live-sdk-bun/index.html --console
      Then open http://localhost:3000/?uniqueId=@creator
      (`--console` mirrors browser console.log/error into the terminal.)

      The uniqueId comes from the page query string (?uniqueId=@creator,
      aliases: unique_id, id, handle). Optional: ?apiUrl= (default
      http://127.0.0.1:8080), ?apiKey=. All output is console.log/error only.
    -->
    <script type="module" src="./live.ts"></script>
  </body>
</html>
